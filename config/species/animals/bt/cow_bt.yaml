schema_version: 1
BehaviorTreeDef:
  defName: Cow
  root:
    type: PrioritySelector
    children:
      # ========== 逃跑（高优先级） ==========
      - type: PrioritySelector
        name: FleeBranch
        children:
          - type: Sequence
            name: ContinueFleeing
            children:
              - type: Condition
                cond: should_flee
              - type: TickIntervalDecorator
                name: SelectFleeDestination
                interval: 20
                child:
                  type: Action
                  action: select_flee_destination
                  status_name: "Selecting Flee Destination"
              - type: Action
                action: plan_path_to_target
                plan_path_move_mode: path
                speed_multiplier_key: flee_speed_multiplier
                energy_multiplier_key: flee_energy_multiplier
                status_name: "Fleeing"
          - type: Sequence
            name: StartFleeing
            children:
              - type: TickIntervalDecorator
                name: CheckForThreatsThrottled
                interval: 15
                child:
                  type: Action
                  action: check_for_threats
                  status_name: "Scanning for Threats"
              - type: Action
                action: select_flee_destination
                status_name: "Selecting Flee Destination"
              - type: Action
                action: plan_path_to_target
                plan_path_move_mode: path
                speed_multiplier_key: flee_speed_multiplier
                energy_multiplier_key: flee_energy_multiplier
                status_name: "Fleeing"
      # ========== 交配（雄性） ==========
      - type: Sequence  # 条件满足后：决策节流 + 执行每帧
        name: Mate
        children:
          - type: Condition
            cond: sex_is_male
          - type: Condition
            cond: can_reproduce
          - type: Condition
            cond: desire_below_param
            probability_param: mating_desire_probability
          - type: PrioritySelector  # 近距交配优先，失败则回退到追逐
            children:
              - type: Action
                action: attempt_to_mate
                mating_range_param: mating_range
                status_name: "Mating"
              - type: Sequence
                children:
                  - type: TickIntervalDecorator  # 每300tick搜索配偶（昂贵决策）
                    name: FindMate
                    interval: 300
                    child:
                      type: Action
                      action: find_available_mate
                      status_name: "Seeking Mate"
                  - type: Action
                    action: plan_path_to_target  # 每帧追逐到配偶
                    status_name: "Chasing Mate"

      # ========== 觅食（草） ==========
      - type: Sequence  # 条件满足后：目标选择节流 + 移动每帧
        name: Forage
        children:
          - type: Condition
            cond: is_hungry
          - type: Condition
            cond: has_food_types
          - type: PrioritySelector
            children:
              - type: Action
                action: eat_target_thing
                kind: grass
                range_param: eating_range
                status_name: "Eating"
              - type: Sequence
                children:
                  - type: TickIntervalDecorator  # 每300tick选择目标；不执行移动
                    name: SelectTarget
                    interval: 300
                    child:
                      type: Action
                      action: select_target_point
                      status_name: "Scanning Food"
                  - type: Action
                    action: plan_path_to_target  # 每帧规划/移动至目标
                    plan_path_move_mode: path
                    status_name: "Chasing Food"

      # ========== 游荡 ==========
      - type: TickIntervalDecorator  # 每帧评估游荡；轻量检查
        name: Wander
        interval: 0
        child:
          type: Action
          action: wander_anywhere      # 随机游荡；受半径与持续时间参数控制
          status_name: "Wandering"
          radius_param: wander_radius
          duration_param: wandering_duration