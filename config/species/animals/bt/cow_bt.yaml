schema_version: 1
BehaviorTreeDef:
  defName: Cow
  root:
    type: PrioritySelector
    children:
      # ========== 逃跑（高优先级） ==========
      - type: TickIntervalDecorator  # 每帧评估，确保快速逃离
        name: Flee
        interval: 0
        child:
          type: Sequence
          children:
            - type: Condition
              cond: should_flee              # danger_nearby 或 threat_distance<=threshold
            - type: Action
              action: flee_from_threat       # 反方向一步并清理繁殖上下文
              status_name: "Fleeing"
      # ========== 交配（雄性） ==========
      - type: Sequence  # 条件满足后：决策节流 + 执行每帧
        name: Mate
        children:
          - type: Condition
            cond: sex_is_male
          - type: Condition
            cond: can_reproduce
          - type: Condition
            cond: desire_below_param
            probability_param: mating_desire_probability
          - type: TickIntervalDecorator  # 每60tick搜索配偶（昂贵决策）
            name: FindMate
            interval: 60
            child:
              type: Action
              action: find_available_mate
              status_name: "Seeking Mate"
          - type: Action
            action: approach_or_mate    # 每帧靠近/交配，保证移动平滑
            status_name: "Approaching Mate"
            mating_range_param: mating_range

      # ========== 觅食（草） ==========
      - type: Sequence  # 条件满足后：目标选择节流 + 移动每帧
        name: Forage
        children:
          - type: Condition
            cond: is_hungry
          - type: Condition
            cond: has_food_types
          - type: PrioritySelector
            children:
              - type: Action
                action: eat_target_thing
                kind: grass
                range_param: eating_range
                status_name: "Eating"
              - type: Sequence
                children:
                  - type: TickIntervalDecorator  # 每30tick选择目标；不执行移动
                    name: SelectTarget
                    interval: 30
                    child:
                      type: Action
                      action: select_target_point
                      status_name: "Scanning Food"
                  - type: Action
                    action: plan_path_to_target  # 每帧规划/移动至目标
                    plan_path_move_mode: direct
                    status_name: "Chasing Food"

      # ========== 游荡 ==========
      - type: TickIntervalDecorator  # 每帧评估游荡；轻量检查
        name: Wander
        interval: 0
        child:
          type: Action
          action: wander_anywhere      # 随机游荡；受半径与持续时间参数控制
          status_name: "Wandering"
          radius_param: wander_radius
          duration_param: wandering_duration