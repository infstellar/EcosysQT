schema_version: 1
BehaviorTreeDef:
  defName: Cow
  root:
    type: PrioritySelector
    children:
      # ========== 逃跑（高优先级） ==========
      - type: Sequence
        name: FleeBranch
        children:
          - type: TickIntervalDecorator
            name: CheckForThreatsThrottled
            interval: 10
            child:
              type: Action
              action: check_for_threats
              status_name: "Scanning for Threats"
          - type: PrioritySelector
            name: FleeStrategySelector
            children:
              - type: Sequence
                name: FollowExistingFleePath
                children:
                  - type: Condition
                    cond: has_current_target
                  - type: Action
                    action: plan_path_to_target
                    plan_path_move_mode: path
                    speed_multiplier_key: flee_speed_multiplier
                    energy_multiplier_key: flee_energy_multiplier
                    ignore_skip_movement: true
                    force_success: true
                    status_name: "Fleeing"
              - type: Sequence
                name: FleePlanA
                children:
                  - type: Action
                    action: select_flee_destination
                    min_angle_deg: -45.0
                    max_angle_deg: 45.0
                    status_name: "Fleeing (Plan A)"
                  - type: Action
                    action: plan_path_to_target
                    plan_path_move_mode: path
                    speed_multiplier_key: flee_speed_multiplier
                    energy_multiplier_key: flee_energy_multiplier
                    ignore_skip_movement: true
                    force_success: true
                    status_name: "Fleeing"
              - type: Sequence
                name: FleePlanB
                children:
                  - type: Action
                    action: select_flee_destination
                    min_angle_deg: 60.0
                    max_angle_deg: 135.0
                    status_name: "Fleeing (Plan B - Flanking)"
                  - type: Action
                    action: plan_path_to_target
                    plan_path_move_mode: path
                    speed_multiplier_key: flee_speed_multiplier
                    energy_multiplier_key: flee_energy_multiplier
                    ignore_skip_movement: true
                    force_success: true
                    status_name: "Fleeing"
              - type: Sequence
                name: FleePanicMove
                children:
                  - type: Action
                    action: select_wander_target
                    status_name: "Fleeing (Panic Move)"
                    radius_param: wander_radius
                    max_wander_cost: 50.0
                  - type: Action
                    action: plan_path_to_target
                    plan_path_move_mode: path
                    speed_multiplier_key: flee_speed_multiplier
                    energy_multiplier_key: flee_energy_multiplier
                    ignore_skip_movement: true
                    force_success: true
                    status_name: "Fleeing"
      # ========== 交配（雄性） ==========
      - type: Sequence  # 条件满足后：决策节流 + 执行每帧
        name: Mate
        children:
          - type: Condition
            cond: sex_is_male
          - type: Condition
            cond: can_reproduce
          - type: Condition
            cond: desire_below_param
            probability_param: mating_desire_probability
          - type: PrioritySelector  # 近距交配优先，失败则回退到追逐
            children:
              - type: Action
                action: attempt_to_mate
                mating_range_param: mating_range
                status_name: "Mating"
              - type: Sequence
                children:
                  - type: TickIntervalDecorator  # 每300tick搜索配偶（昂贵决策）
                    name: FindMate
                    interval: 300
                    child:
                      type: Action
                      action: find_available_mate
                      status_name: "Seeking Mate"
                  - type: Action
                    action: update_mate_target_position
                    status_name: "Tracking Mate"
                  - type: Action
                    action: plan_path_to_target  # 每帧追逐到配偶
                    status_name: "Chasing Mate"

      # ========== 觅食（草） ==========
      - type: Sequence  # 条件满足后：目标选择节流 + 移动每帧
        name: Forage
        children:
          - type: Condition
            cond: is_hungry
          - type: Condition
            cond: has_food_types
          - type: PrioritySelector
            children:
              - type: Action
                action: eat_target_thing
                kind: grass
                range_param: eating_range
                status_name: "Eating"
              - type: Sequence
                children:
                  - type: Action
                    action: seek_thing_with_path
                    kind: grass
                    search_interval: 300
                    status_name: "Seeking Food"
                    speed_multiplier_key: chase_speed_multiplier
                    energy_multiplier_key: chase_energy_multiplier

      # ========== 游荡 (修正后) ==========
      - type: PrioritySelector
        name: WanderBranch
        children:

          # 优先级 1: "清理" (如果已抵达)
          - type: Sequence
            name: ArrivedAtWanderTarget
            children:
              - type: Condition
                cond: is_at_target
                stop_range_param: wander_stop_range
              - type: Action
                action: clear_blackboard_target
                status_name: "Idle"

          # 优先级 2: "执行" (如果有目标且未抵达)
          - type: Action
            action: plan_path_to_target
            status_name: "Wandering"
            speed_multiplier_key: wander_speed_multiplier
            energy_multiplier_key: wander_energy_multiplier
            range_param: wander_stop_range

          # 优先级 3: "决策" (如果无目标)
          - type: TickIntervalDecorator
            name: SelectWanderTargetThrottled
            interval: 300
            child:
              type: Action
              action: select_wander_target
              status_name: "Picking Wander Spot"
              radius_param: wander_radius
              max_wander_cost: 300.0