schema_version: 1
BehaviorTreeDef:
  defName: Cow
  root:
    type: PrioritySelector
    children:
      # ========== 逃跑（高优先级） ==========
      - type: PrioritySelector
        name: FleeBranch
        children:
          - type: Sequence
            name: ContinueFleeing
            children:
              - type: Condition
                cond: should_flee
              - type: PrioritySelector
                name: FleeStrategySelector
                children:
                  - type: Sequence
                    name: FollowExistingFleePath
                    children:
                      - type: Condition
                        cond: has_current_target
                      - type: Action
                        action: plan_path_to_target
                        plan_path_move_mode: path
                        speed_multiplier_key: flee_speed_multiplier
                        energy_multiplier_key: flee_energy_multiplier
                        ignore_skip_movement: true
                        status_name: "Fleeing"
                  - type: Sequence
                    name: FleePlanA
                    children:
                      - type: Action
                        action: select_flee_destination
                        min_angle_deg: -45.0
                        max_angle_deg: 45.0
                        status_name: "Fleeing (Plan A)"
                      - type: Action
                        action: plan_path_to_target
                        plan_path_move_mode: path
                        speed_multiplier_key: flee_speed_multiplier
                        energy_multiplier_key: flee_energy_multiplier
                        ignore_skip_movement: true
                        status_name: "Fleeing"
                  - type: Sequence
                    name: FleePlanB
                    children:
                      - type: Action
                        action: select_flee_destination
                        min_angle_deg: 60.0
                        max_angle_deg: 135.0
                        status_name: "Fleeing (Plan B - Flanking)"
                      - type: Action
                        action: plan_path_to_target
                        plan_path_move_mode: path
                        speed_multiplier_key: flee_speed_multiplier
                        energy_multiplier_key: flee_energy_multiplier
                        ignore_skip_movement: true
                        status_name: "Fleeing"
                  - type: Action
                    action: wander_anywhere
                    status_name: "Fleeing (Panic Move)"
          - type: Sequence
            name: StartFleeing
            children:
              - type: TickIntervalDecorator
                name: CheckForThreatsThrottled
                interval: 15
                child:
                  type: Action
                  action: check_for_threats
                  status_name: "Scanning for Threats"
              - type: Action
                action: select_flee_destination
                min_angle_deg: -45.0
                max_angle_deg: 45.0
                status_name: "Selecting Flee Destination"
              - type: Action
                action: plan_path_to_target
                plan_path_move_mode: path
                speed_multiplier_key: flee_speed_multiplier
                energy_multiplier_key: flee_energy_multiplier
                ignore_skip_movement: true
                status_name: "Fleeing"
      # ========== 交配（雄性） ==========
      - type: Sequence  # 条件满足后：决策节流 + 执行每帧
        name: Mate
        children:
          - type: Condition
            cond: sex_is_male
          - type: Condition
            cond: can_reproduce
          - type: Condition
            cond: desire_below_param
            probability_param: mating_desire_probability
          - type: PrioritySelector  # 近距交配优先，失败则回退到追逐
            children:
              - type: Action
                action: attempt_to_mate
                mating_range_param: mating_range
                status_name: "Mating"
              - type: Sequence
                children:
                  - type: TickIntervalDecorator  # 每300tick搜索配偶（昂贵决策）
                    name: FindMate
                    interval: 300
                    child:
                      type: Action
                      action: find_available_mate
                      status_name: "Seeking Mate"
                  - type: Action
                    action: plan_path_to_target  # 每帧追逐到配偶
                    status_name: "Chasing Mate"

      # ========== 觅食（草） ==========
      - type: Sequence  # 条件满足后：目标选择节流 + 移动每帧
        name: Forage
        children:
          - type: Condition
            cond: is_hungry
          - type: Condition
            cond: has_food_types
          - type: PrioritySelector
            children:
              - type: Action
                action: eat_target_thing
                kind: grass
                range_param: eating_range
                status_name: "Eating"
              - type: Sequence
                children:
                  - type: Action
                    action: seek_thing_with_path
                    kind: grass
                    search_interval: 300
                    status_name: "Seeking Food"
                    speed_multiplier_key: chase_speed_multiplier
                    energy_multiplier_key: chase_energy_multiplier

      # ========== 游荡 ==========
      - type: TickIntervalDecorator  # 每帧评估游荡；轻量检查
        name: Wander
        interval: 0
        child:
          type: Action
          action: wander_anywhere      # 随机游荡；受半径与持续时间参数控制
          status_name: "Wandering"
          radius_param: wander_radius
          duration_param: wandering_duration