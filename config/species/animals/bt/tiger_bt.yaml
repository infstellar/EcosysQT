schema_version: 1
BehaviorTreeDef:
  defName: Tiger
  root:
    type: PrioritySelector
    children:
      # ========== 逃跑（高优先级） ==========
      - type: Sequence
        name: Flee
        children:
          - type: Condition
            cond: should_flee              # danger_nearby 或 threat_distance<=threshold
          - type: Action
            action: flee_from_threat       # 反方向一步并清理繁殖上下文

      # ========== 交配（雄性） ==========
      - type: Sequence
        name: Mate
        children:
          - type: Condition
            cond: sex_is_male
          - type: Condition
            cond: can_reproduce
          - type: Condition
            cond: desire_below_param
            probability_param: mating_desire_probability
          - type: Action
            action: find_available_mate
          - type: Action
            action: approach_or_mate
            mating_range_param: mating_range

      # ========== 捕食（牛） - [已修正] ==========
      - type: Sequence
        name: Hunt
        children:
          - type: Condition
            cond: is_hungry                  # 1. 必须饥饿
          - type: PrioritySelector           # 2. 优先尝试近处，失败则尝试远处
            children:
              # 尝试 1: 就近捕食
              # 如果近处有牛 (hunt_nearby_race 返回 Success/Running)，则执行此动作
              - type: Action
                action: hunt_nearby_race
                kind: cow
                range_param: hunting_range
                success_rate_param: hunting_success_rate
              
              # 尝试 2: 追逐远处目标
              # 只有当 'hunt_nearby_race' 返回 Failure (近处没牛) 时，才会执行这个 Sequence
              - type: Sequence
                children:
                  - type: Action
                    action: select_target_point       # 远处猎物搜索与目标选择
                  - type: Action
                    action: plan_path_to_target       # 路径规划至 current_target
                    range_param: hunting_range  # <--- 在这里添加这一行

      # ========== 游荡 ==========
      - type: Action
        name: Wander
        action: wander_anywhere
        radius_param: wander_radius
        duration_param: wandering_duration