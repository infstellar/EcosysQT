schema_version: 1
parent: base_animal
species:
  energy: 400
  max_age: 4000
  reproduction_energy_cost: 50     # 提高繁殖能量门槛，避免能量过低仍繁殖
animal:
  movement_speed: 1.0
  energy_consumption: 0.5
  detection_range: 200.0
  wander_radius: 35.0
  food_types:
    - grass
  use_bt: true
  # 行为树黑板参数：吃草的总持续tick数，可被 ProgressDecorator 读取
  bt_params:
    ints:
      eat_grass_total_ticks: 10
      flee_total_duration_ticks: 150   # 逃逸冷却总时长（tick）
    doubles:
      flee_speed_multiplier: 1.8
      flee_energy_multiplier: 1.5
      flee_destination_radius: 80.0    # 逃逸目的地目标半径（可选）
      wander_speed_multiplier: 0.5
      wander_energy_multiplier: 0.5
      chase_speed_multiplier: 1.0
      chase_energy_multiplier: 1.0
      # 饥饿状态速度惩罚：饥饿时全局基础速度倍率（用于所有移动动作）
      starving_energy_multiplier: 0.6
      starving_speed_multiplier: 0.85
      stop_range_base_range: 1.0  # (等于 eating_range)
      stop_range_factor: 0.5      # (50%)
  min_reproduction_age: 100        # 提高性成熟年龄，降低早期繁殖
  reproduction_cooldown: 200       # 产后冷却（已在代码中改为分娩后开启）
  eating_range: 1

  wandering_duration: 150
  # 繁殖相关
  pregnancy_duration: 300         # 延长妊娠时间
  mating_range: 5.0        
  pregnancy_speed_penalty: 0.6 
  mating_desire_probability: 0.5  # 进一步降低交配意愿，避免频繁扣能量

  # 基础营养值
  nutrition_value: 500.0
  # energy加成
  nutrition_bonus_max: 5.0
  nutrition_bonus_curve_alpha: 2.0
  # 饥饿相关
  starvation_damage: 0.5
  starvation_damage_interval_ratio: 0.003
  satisfied_threshold_ratio: 0.75
  starving_threshold_ratio: 0.2
  energy_efficiency: 0.7
  # energy加成 ~ https://doi.org/10.1093/conphys/coac083
  # 加成公式 = nutrition_bonus_max * pow(prey.energy / prey.max_energy, nutrition_bonus_curve_alpha)
  # 最终获得能量 gained_energy = (prey.nutrition_value + bonus) * predator.energy_efficiency
  nutrition_bonus_max: 0.5 # 相当于最多额外获得猎物当前的power0.5倍
  nutrition_bonus_curve_alpha: 1.0 # 1.0就相当于线性获得猎物当前的power
  # HP恢复基础速率
  hp_regen_base_per_day: 500.0
  # HP恢复的状态加成：
  hp_regen_mul_satisfied: 5.0
  hp_regen_mul_normal: 2.0
  hp_regen_mul_starving: 0.05
  # HP恢复周期（0-1天）
  regan_interval_ratio: 0.001