schema_version: 1
parent: base_animal
species:
  energy: 400
  max_age: 4000
  reproduction_energy_cost: 50     # 提高繁殖能量门槛，避免能量过低仍繁殖
animal:
  movement_speed: 1.0
  energy_consumption: 0.5
  detection_range: 200.0
  wander_radius: 35.0
  food_types:
    - grass
  use_bt: true
  # 行为树黑板参数：吃草的总持续tick数，可被 ProgressDecorator 读取
  bt_params:
    ints:
      eat_grass_total_ticks: 20
  doubles:
      flee_speed_multiplier: 1.2
      flee_energy_multiplier: 1.2
      wander_speed_multiplier: 0.5
      wander_energy_multiplier: 0.5
      chase_speed_multiplier: 1.0
      chase_energy_multiplier: 1.0
      # 饥饿状态速度惩罚：饥饿时全局基础速度倍率（用于所有移动动作）
      starving_energy_multiplier: 0.6
      starving_speed_multiplier: 0.85
  min_reproduction_age: 100        # 提高性成熟年龄，降低早期繁殖
  reproduction_cooldown: 200       # 产后冷却（已在代码中改为分娩后开启）
  eating_range: 12.0
  satisfied_threshold_ratio: 0.75
  starving_threshold_ratio: 0.3
  wandering_duration: 50
  energy_efficiency: 0.7
  pregnancy_duration: 300         # 延长妊娠时间
  mating_range: 5.0        
  pregnancy_speed_penalty: 0.6 
  mating_desire_probability: 0.5  # 进一步降低交配意愿，避免频繁扣能量