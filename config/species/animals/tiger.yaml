schema_version: 1
parent: base_animal
species:
  energy: 4000
  max_age: 8000
  reproduction_energy_cost: 1000
animal:
  movement_speed: 4.0
  energy_consumption: 15
  hunting_range: 6.0
  hunting_success_rate: 0.2
  detection_range: 200.0
  food_types:
    - cow
  use_bt: true
  # 行为树黑板默认逃离倍率配置
  bt_params:
    doubles:
      flee_speed_multiplier: 1.5
      flee_energy_multiplier: 1.5
      flee_destination_radius: 120.0
      wander_speed_multiplier: 0.9
      wander_energy_multiplier: 0.8
      chase_speed_multiplier: 1.4
      chase_energy_multiplier: 1.3
      pathfinding_budget_multiplier: 2.5
      # 饥饿状态速度惩罚：饥饿时全局基础速度倍率（用于所有移动动作）
      starving_energy_multiplier: 0.75
      starving_speed_multiplier: 0.9
      # 攻击后摇减速倍率：处于攻击冷却时的全局速度乘数
      attack_recovery_speed_multiplier: 0.7
      stop_range_base_range: 2.0  # (等于 hunting_range)
      stop_range_factor: 1.0      # (100%)
    ints:
      mating_intent_lock_duration: 40
      forage_intent_lock_duration: 30
  hunting_cooldown_duration: 4
  min_reproduction_age: 30
  reproduction_cooldown: 800
  satisfied_threshold_ratio: 0.7
  starving_threshold_ratio: 0.25
  wandering_duration: 80
  energy_efficiency: 0.3
  pregnancy_duration: 110  
  mating_range: 12.0       
  pregnancy_speed_penalty: 0.5