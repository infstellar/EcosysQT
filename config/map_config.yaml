world:
  width: 3200
  height: 1800

# 兼容两种结构，推荐使用 initial_populations。两者合并；同名以最后出现为准。
initial_populations:
  grass: 1500
  cow: 40
  tiger: 5

# 模拟参数（可选覆盖，缺省使用默认值）
simulation:
  ticks_per_day: 3000
  ticks_per_hour: 125
  max_thing_placement_attempts: 16
  # 年/季度参数（可以只配置其中一部分；未配置的按默认计算）
  days_per_year: 40
  quadrums_per_year: 4
  days_per_quadrum: 10

# 可选的分区结构（演示用途）：
#populations:
#  races:
#    cow: 20
#    tiger: 3
#  things:
#    grass: 10

# 支持两种结构：
# 1) 扁平：
#    world: { width: <int>, height: <int> }
#    initial_populations: { grass: 10, cow: 20, tiger: 3 }
# 2) 分区（兼容旧规划）：
#    world: { width, height }
#    populations:
#      races: { cow: 20, tiger: 3 }
#      things: { grass: 10 }
# 两者会合并到 EcosystemConfig.initial_populations。